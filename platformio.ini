[platformio]
default_envs = cyd

; ESP32-2432S028R "Cheap Yellow Display", 2.8" ILI9341.
; espressif32 6.x is Arduino core 2.x, which this TFT_eSPI setup and
; the sketch's ArduinoJson 6 types are written for.
[env:cyd]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-2110
monitor_port = /dev/cu.usbserial-2110
build_flags =
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=1
	-DLOAD_GLCD=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DUSE_HSPI_PORT=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@6.21.5
